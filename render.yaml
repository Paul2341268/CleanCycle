# Free classroom demo. Local SQLite resets when Render restarts or sleeps.
services:
  - type: web
    name: cleancycle
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CLEANCYCLE_DB
        value: /var/data/cleancycle.sqlite3
      - key: COOKIE_SECURE
        value: "1"
      - key: KMA_SERVICE_KEY
        sync: false
      - key: AIRKOREA_SERVICE_KEY
        sync: false
