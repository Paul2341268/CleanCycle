# Personal classroom app. Records stay in the visitor's browser.
services:
  - type: web
    name: cleancycle
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: KMA_SERVICE_KEY
        sync: false
      - key: AIRKOREA_SERVICE_KEY
        sync: false
